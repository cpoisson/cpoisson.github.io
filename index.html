    <script>

    <style>
      @font-face {
        font-family: 'Archivo';
        font-style: normal;
        font-weight: 400 900;
        font-stretch: 62% 125%;
        font-display: swap;
        src: url('fonts/archivo-latin.woff2') format('woff2');
      }
      :root { --ink: #000; --paper: #fff; --sage: #6ea37c; --terracotta: #c96a45; color-scheme: light; }
      :root[data-theme="night"] { --ink: #fff; --paper: #000; color-scheme: dark; }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="day"]) { --ink: #fff; --paper: #000; color-scheme: dark; }
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html { background: var(--paper); color: var(--ink); }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px 16px;
        font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main { width: 100%; max-width: 360px; }
      .avatar {
        display: block;
        width: 112px;
        height: 112px;
        border-radius: 50%;
        object-fit: cover;
        margin: 0 auto 20px;
      }
      h1 {
        font-size: clamp(1.75rem, 8vw, 2.25rem);
        font-weight: 900;
        font-stretch: 108%;
        letter-spacing: -0.02em;
        line-height: 1;
        padding-bottom: 14px;
        border-bottom: 3px solid var(--sage);
      }
      .role { margin-top: 14px; font-size: 1rem; font-weight: 800; line-height: 1.3; }
      .bio { margin-top: 8px; font-size: 0.9375rem; line-height: 1.45; }
      .links { list-style: none; margin-top: 8px; }
      .links li { border-bottom: 1px solid var(--ink); }
      .links a {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 14px 2px;
        color: var(--ink);
        text-decoration: none;
        font-size: 1.125rem;
        font-weight: 700;
      }
      .links svg { width: 20px; height: 20px; flex: none; fill: currentColor; }
      .links a[aria-label="Email"] svg { fill: none; }
      .links .label { flex: 1; }
      .links .arrow { color: var(--sage); transition: transform 0.15s; }
      .links a:hover, .links a:focus-visible { color: var(--terracotta); outline: none; }
      .links a:hover .arrow, .links a:focus-visible .arrow { color: var(--terracotta); transform: translateX(4px); }
      .theme {
        position: fixed;
        top: 16px;
        right: 16px;
        width: 40px;
        height: 40px;
        display: grid;
        place-items: center;
        background: none;
        border: 1px solid var(--ink);
        border-radius: 50%;
        color: var(--ink);
        cursor: pointer;
      }
      .theme:hover, .theme:focus-visible { color: var(--terracotta); border-color: var(--terracotta); outline: none; }
      .theme svg { width: 18px; height: 18px; }
      .theme .sun { display: none; }
      :root[data-theme="night"] .theme .sun { display: block; }
      :root[data-theme="night"] .theme .moon { display: none; }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="day"]) .theme .sun { display: block; }
        :root:not([data-theme="day"]) .theme .moon { display: none; }
      }
      .links a:focus-visible .label { text-decoration: underline; text-underline-offset: 4px; }
    </style>

    <script>
      document.querySelector('.theme').addEventListener('click', () => {
        const root = document.documentElement;
        const current = root.dataset.theme
          || (matchMedia('(prefers-color-scheme: dark)').matches ? 'night' : 'day');
        const next = current === 'night' ? 'day' : 'night';
        root.dataset.theme = next;
        try { localStorage.setItem('theme', next); } catch (e) {}
      });
    </script>
